[env]
CARGO_MAKE_WORKSPACE_SKIP_MEMBERS = "aswmake-lib"

[tasks.run]
command = "cargo"
args = ["run"]

[tasks.test-lib]
description = "Tests the library"
command = "cargo"
args = ["make", "--makefile", "aswmake-lib/Makefile.toml", "--task", "test"]

[tasks.test-cli]
description = "Tests the executable"
command = "cargo"
args = ["nextest", "run", "-p", "aswmake"]

[tasks.test]
dependencies = ["test-cli", "test-lib"]